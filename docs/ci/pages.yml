# Publishes site/ (landing page + privacy policy) to GitHub Pages.
# Copy to .github/workflows/pages.yml, then in the repository settings:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Pushing workflow files needs a token with the `workflow` scope (see docs/RELEASE.md).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
