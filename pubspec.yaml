name: flourish
description: "Flourish - Smart Multi-Account Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  shimmer: ^3.0.0
  file_picker: ^8.0.0
  flutter_slidable: ^3.1.1
  decimal: ^3.2.6
  http: ^1.6.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  archive: ^3.6.1
  excel: ^4.0.6
  csv: ^8.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  # Bundled so google_fonts never fetches over the network. File names must
  # match google_fonts' "<Family>-<Weight>.ttf" convention to be picked up.
  assets:
    - assets/fonts/manrope/
    - assets/fonts/space_grotesk/
